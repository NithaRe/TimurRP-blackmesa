name: PR Changelogs
on:
  pull_request_target:
    branches: [blackmesa]
    types: [closed]

concurrency:
  group: blackm-changelog
  queue: max

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Executable scripts come only from the trusted default branch.
      - name: Checkout automation from default branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: automation
          persist-credentials: false
      # The target branch is used only as data and as the git push target.
      - name: Checkout BlackM changelog target
        uses: actions/checkout@v4.2.2
        with:
          ref: blackmesa
          path: target
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --prefix automation/Tools/changelog --ignore-scripts --no-audit --no-fund
      - name: Test changelog scripts
        working-directory: target
        run: node --test ../automation/Tools/changelog/changelog.test.js ../automation/Tools/changelog/discord.test.js
      - name: Generate changelog
        working-directory: target
        run: node ../automation/Tools/changelog/changelog.js
      - name: Commit changelog
        working-directory: target
        run: |
          git add Resources/Changelog/bmchangelog.yml
          if git diff --cached --quiet; then
            echo 'No changelog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update BlackM changelog'
          git push
      - name: Notify Discord
        working-directory: target
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: node ../automation/Tools/changelog/discord.js
