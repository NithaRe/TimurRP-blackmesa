name: PR Changelogs
on:
  pull_request_target:
    branches: [blackmesa]
    types: [closed]

# Serialise commits without dropping pending merged PRs.
concurrency:
  group: blackm-changelog
  queue: max

jobs:
  changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout only the trusted target branch, never the PR branch.
      - name: Checkout target branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --prefix Tools/changelog --ignore-scripts --no-audit --no-fund
      - name: Test changelog script
        run: node --test Tools/changelog/changelog.test.js Tools/changelog/discord.test.js
      - name: Generate changelog
        run: node Tools/changelog/changelog.js
      - name: Commit changelog
        run: |
          git add Resources/Changelog/bmchangelog.yml
          if git diff --cached --quiet; then
            echo 'No changelog changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update BlackM changelog'
          git push
      - name: Notify Discord
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
        run: node Tools/changelog/discord.js
