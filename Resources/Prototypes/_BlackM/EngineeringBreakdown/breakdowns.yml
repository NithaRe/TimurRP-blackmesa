- type: engineeringBreakdown
  id: BreakdownApcOverload
  name: engineering-breakdown-apc-overload-name
  description: engineering-breakdown-apc-overload-desc
  reward: 2500
  whitelist:
    components:
    - Apc
  effects:
  - ApcBreakerOff
  steps:
  - quality: Screwing
    delay: 2
    hint: engineering-breakdown-hint-apc-panel
    done: engineering-breakdown-done-apc-panel
  - quality: Cutting
    delay: 4
    hint: engineering-breakdown-hint-cut-burnt
    done: engineering-breakdown-done-cut-burnt
  - quality: Pulsing
    delay: 3
    hint: engineering-breakdown-hint-calibrate
    done: engineering-breakdown-done-calibrate
  attachedEffect: BreakdownSparksLoop
  burstEffect: BreakdownSparksBurst
  burstInterval: 6
  burstSound:
    collection: sparks
    params:
      volume: -4
  breakSound:
    path: /Audio/Effects/Lightning/lightningshock.ogg
  shockChance: 0.3
  shockDamage: 12
  color: "#FF9F1C"
  severity: 2
  escalationIntensity: 15

