- type: entity
  id: AccessCardHolder
  name: карта доступа
  description: Специальная карта-держатель. Вмещает до 6 значков, которые дают различные уровни доступа. Осмотрите карту, чтобы увидеть вставленные значки.
  parent: BaseItem
  components:
    - type: AccessCardHolder
      maxBadges: 6
      badgeContainerId: badge_slots
    - type: IdCard
      fullName: ""
      jobTitle: ""
    - type: Clothing
      slots:
        - idcard
    - type: Tag
      tags:
        - WhitelistChameleon
        - WhitelistChameleonIdCard
    - type: Sprite
      sprite: _BlackM/Objects/Misc/access_card_holder.rsi
      layers:
        - state: icon
    - type: Item
      size: Small
      storedRotation: -90
    - type: ContainerContainer
      containers:
        badge_slots: !type:Container {}

- type: entity
  id: BaseBadge
  abstract: true
  parent: BaseItem
  components:
    - type: Badge
    - type: Item
      size: Tiny
    - type: Sprite
      sprite: _BlackM/Objects/Misc/badges.rsi
      layers:
        - state: command

- type: entity
  id: BadgeCommand
  name: значок командования
  description: Золотой значок командования. Даёт доступ к командным зонам станции.
