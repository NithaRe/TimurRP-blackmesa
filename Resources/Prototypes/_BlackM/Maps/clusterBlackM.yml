            Captain: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 3, 6 ]
            SecurityCadet: [ 1, 2 ]
            Brigmedic: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Scientist: [ 4, 8 ]
            ResearchAssistant: [ 2, 2 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            MedicalDoctor: [ 3, 6 ]
            MedicalIntern: [1, 2]
            Surgeon: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            CargoTechnician: [ 2, 4 ]
            ChiefEngineer: [ 1, 1 ]
            StationEngineer: [ 1, 1 ]
            Chef: [ 1, 2 ]
            Botanist: [ 1, 2 ]
            Bartender: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Passenger: [ -1, -1 ]
 
        # Goobstation blob-config-start SMALL+
