- type: soundCollection
  id: BlackMGib
  files:
  - /Audio/_BlackM/Gib/gib1.ogg
  - /Audio/_BlackM/Gib/gib2.ogg
  - /Audio/_BlackM/Gib/gib3.ogg

- type: soundCollection
  id: BlackMGibDrops
  files:
  - /Audio/_BlackM/Gib/drops1.ogg
  - /Audio/_BlackM/Gib/drops2.ogg

- type: entity
  id: BlackMGibSplatBase
  abstract: true
  name: кровавые брызги
  description: Свежая кровь. Совсем недавно это было живым.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _BlackM/Effects/Gib/splat.rsi
    drawdepth: FloorObjects
    noRot: false

- type: entity
  parent: BlackMGibSplatBase
  id: BlackMGibSplat1
  components:
  - type: Sprite
    state: splat1

- type: entity
  parent: BlackMGibSplatBase
  id: BlackMGibSplat2
  components:
  - type: Sprite
    state: splat2

- type: entity
  parent: BlackMGibSplatBase
  id: BlackMGibSplat3
  components:
  - type: Sprite
    state: splat3

- type: entity
  parent: BlackMGibSplatBase
  id: BlackMGibSplat4
  components:
  - type: Sprite
    state: splat4

