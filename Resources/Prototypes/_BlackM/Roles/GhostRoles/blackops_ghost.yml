- type: entity
  id: RandomHumanoidBlackOpsLeaderSpawner
  name: Black Ops leader
  suffix: BlackMesa, Ghost role, Whitelist
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet_mask.rsi
      state: icon
  - type: RandomMetadata
    nameSegments:
    - NamesMilitaryFirstLeader
    - NamesMilitaryLast
    nameFormat: name-format-standard
  - type: RandomHumanoidSpawner
    settings: BlackOpsLeaderSettings

