- type: entity
  id: EvacConsole
  name: консоль эвакуации
  description: Используется для активации врат эвакуации на поверхность.
  parent: BaseComputerAiAccess
  components:
  - type: EvacConsole
  - type: ActivatableUI
    key: enum.EvacConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.EvacConsoleUiKey.Key:
        type: EvacConsoleBoundUserInterface
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shuttle
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: AccessReader
    access: [["Captain"], ["HeadOfPersonnel"]]

- type: entity
  id: EvacPortalMarker
  name: маркер врат эвакуации
  description: Невидимая точка где появятся врата эвакуации.
  categories:
  - HideSpawnMenu
  components:
  - type: EvacPortalMarker
  - type: Transform

- type: entity
  id: EvacPortalDestinationMarker
  name: маркер выхода из врат эвакуации
  description: Невидимая точка где появится выход на карте эвакуации.
  categories:
  - HideSpawnMenu
  components:
  - type: EvacPortalMarker
    isDestination: true
  - type: Transform

- type: entity
  id: EvacPortal
  name: врата эвакуации
  description: Мерцающий портал ведущий на поверхность. Оставайтесь рядом чтобы пройти через него.
  components:
  - type: EvacPortal
  - type: LinkedEntity
  - type: Sprite
    sprite: Effects/portal.rsi
    state: portal-red

- type: entity
  id: EvacPortalDestination
  name: выход эвакуации
  description: Портал ведущий обратно на объект.
  components:
  - type: EvacPortal
  - type: LinkedEntity
  - type: Sprite
    sprite: Effects/portal.rsi
    state: portal-blue
