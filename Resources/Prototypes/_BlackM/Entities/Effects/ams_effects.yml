- type: entity
  id: AmsEffectBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    noRot: true

- type: entity
  id: AmsEffectShockwave
  parent: AmsEffectBase
  components:
  - type: Sprite
    sprite: _BlackM/Effects/ams_shockwave.rsi
    layers:
    - state: ring
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.96
  - type: PointLight
    radius: 6
    energy: 4
    color: "#4fd8ff"

- type: entity
  id: AmsEffectShockwaveLarge
  parent: AmsEffectShockwave
  components:
  - type: Sprite
    scale: 2.5, 2.5
  - type: PointLight
    radius: 12
    energy: 6

- type: entity
  id: AmsEffectShockwaveHuge
  parent: AmsEffectShockwave
  components:
  - type: Sprite
    scale: 6.0, 6.0
  - type: PointLight
    radius: 20
    energy: 8
    color: "#b6ffd9"

- type: entity
  id: AmsEffectBlastFlash
  parent: AmsEffectBase
  components:
  - type: Sprite
    sprite: _BlackM/Effects/ams_blast.rsi
    scale: 1.5, 1.5
    layers:
    - state: flash
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.4
  - type: PointLight
    radius: 7
    energy: 9
    color: "#c9fbff"

- type: entity
  id: AmsEffectRift
  parent: AmsEffectBase
  components:
  - type: Sprite
    sprite: _BlackM/Effects/ams_blast.rsi
    scale: 1.2, 1.2
    layers:
    - state: rift
      shader: unshaded

- type: entity
  id: AmsEffectArc
  parent: AmsEffectBase
  components:
  - type: Sprite
    sprite: _BlackM/Effects/ams_fx.rsi
    scale: 2.0, 2.0
    layers:
    - state: arc
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.3
  - type: PointLight
    radius: 3
    energy: 3
    color: "#7fe6ff"
