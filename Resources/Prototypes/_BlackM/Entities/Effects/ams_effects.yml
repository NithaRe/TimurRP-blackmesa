- type: entity
  id: AmsXenPortal
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _BlackM/Effects/Ams/ams_fx.rsi
    drawdepth: Effects
    noRot: true
    layers:
    - state: portal
      shader: unshaded
  - type: PointLight
    enabled: true
    radius: 4
    energy: 3
    color: "#5dff3a"
  - type: TimedDespawn
    lifetime: 2.4
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_BlackM/Ams/ams_portal.ogg
      params:
        volume: -2
        maxDistance: 12
