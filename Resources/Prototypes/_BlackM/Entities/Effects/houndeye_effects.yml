- type: entity
  id: HoundeyeScreamEffect
  name: houndeye scream wave
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: OverMobs
    noRot: true
    layers:
    - state: wave
      sprite: _BlackM/Effects/houndeye_scream.rsi
      shader: unshaded
  - type: TimedDespawn
    lifetime: 1.24
  - type: Transform
    anchored: false

