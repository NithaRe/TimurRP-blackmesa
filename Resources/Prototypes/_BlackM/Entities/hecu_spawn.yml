- type: entity
  id: HecuSpawnPointBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Marker
  - type: Clickable
  - type: InteractionOutline
  - type: Tag
    tags:
    - ForceFixRotations
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi

- type: entity
  id: HecuSpawnPoint
  name: HECU spawn point
  description: Точка спавна солдат HECU. При синхронизации портала через 20 секунд здесь появится солдат.
  parent: HecuSpawnPointBase
  components:
  - type: HecuSpawnPoint
  - type: Sprite
    drawdepth: Overdoors
    sprite: Markers/cross.rsi
    state: green