- type: entity
  name: зен кристалл
  parent: BaseStructure
  id: ZenCrystal
  description: Дорогостоящий ресурс из мира зен. Тусклеет со временем, из-за чего становится менее ценным.
  placement:
    mode: PlaceFree
  components:
  - type: ZenCrystalRaw
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _BlackM/Objects/Zen/crystal.rsi
    state: crystal_zen
    noRot: true
  - type: PointLight
    radius: 2
    energy: 3
    color: "#FFFF00"
  - type: Pullable
  - type: Anchorable
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0.6
    angularDamping: 0.6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 40
        mask:
          - ItemMask
        layer:
          - MidImpassable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 5000

  - type: PriceDecay
    initialPrice: 5000
    minPrice: 100
    targetMinutes: 100
    curvePower: 1

  - type: Tag
    tags:
    - ZenCrystal

- type: entity
  id: ZenCrystalSample
  parent: BaseItem
  name: Xen crystal sample
  description: A crystal seed cut from a natural Xen crystal. It can be studied and cultivated in a laboratory.
  components:
  - type: Item
    size: Small
  - type: ZenCrystalResearch
  - type: ZenCrystalVisuals
  - type: Sprite
    sprite: _BlackM/Objects/Zen/research_crystal.rsi
    noRot: true
    layers:
    - state: seed
      map: ["enum.ZenCrystalVisualLayers.Base"]
    - state: seed
      shader: unshaded
      visible: false
      map: ["enum.ZenCrystalVisualLayers.Glow"]
    - state: deposits
      visible: false
      map: ["enum.ZenCrystalVisualLayers.Deposits"]
    - state: seed-cracks
      visible: false
      map: ["enum.ZenCrystalVisualLayers.Cracks"]
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#EAC94D"
  - type: StaticPrice
    price: 0
