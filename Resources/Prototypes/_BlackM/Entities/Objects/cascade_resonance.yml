- type: entity
  id: CascadeResonanceDevice
  name: cascade resonance device
  description: A device that initiates cascade resonance.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    state: paper
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: CascadeResonance
    allowedJobs:
    - BmesaResearchDirector
    - GordonFreeman
    duration: 120
    startMessage: cascade-resonance-start
    countdownMessage: cascade-resonance-countdown
    completeMessage: cascade-resonance-complete
    startSound:
      path: /Audio/_BlackM/cascade_start.ogg
    countdownSound:
      path: /Audio/_BlackM/cascade_tick.ogg
    completeSound:
      path: /Audio/_BlackM/cascade_complete.ogg
    teleportTargetTag: HecuTeleportTarget