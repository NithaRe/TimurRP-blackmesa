- type: entity
  id: BadgePrinter
  name: принтер проверяющего
  description: я говорил тебе, что такое безумие? Печатает ключи доступа и перепечатает бракованый паспорт.
  parent: BaseMachinePowered
  components:
    - type: Sprite
      sprite: _BlackM/Structures/Machines/badge_printer.rsi
      layers:
        - state: icon-off
          map: ["enum.PowerDeviceVisualLayers.Powered"]
    - type: BadgePrinter
      cardSlotId: badge_printer_card_slot
      paperPrototype: Paper
      maxBadgesPerPrint: 6
      availableBadges:
        - proto: BadgeSecurity
          iconState: security
        - proto: BadgeMaintenance
          iconState: maintenance
        - proto: BadgeSupply
          iconState: supply
        - proto: BadgeScience
          iconState: science
        - proto: BadgeService
          iconState: service
        - proto: BadgeMedical
          iconState: medical
        - proto: BadgeCommand
          iconState: command
          max: 8
        - proto: BadgeCaptain
          iconState: captain
          max: 1
        - proto: BadgeQuartermaster
          iconState: supplychief
          max: 1
        - proto: BadgeChiefEngineer
          iconState: engineerchief
          max: 1
        - proto: BadgeResearchDirector
          iconState: sciencechief
          max: 1
        - proto: BadgeChiefMedicalOfficer
          iconState: medicalchief
          max: 1
        - proto: BadgeHeadOfSecurity
          iconState: securityhos
          max: 1
    - type: ItemSlots
      slots:
        badge_printer_card_slot:
          name: badge-printer-card-slot
          whitelist:
            components:
              - AccessCardHolder
          insertSound: /Audio/Machines/id_swipe.ogg
          ejectSound: /Audio/Machines/id_swipe.ogg
        badge_printer_permit_slot:
          name: badge-printer-permit-slot
          whitelist:
            components:
              - BadgePrintPermit
          insertSound: /Audio/Machines/id_swipe.ogg
          ejectSound: /Audio/Machines/id_swipe.ogg
        badge_printer_passport_slot:
          name: badge-printer-passport-slot
          whitelist:
            components:
              - Passport
          insertSound: /Audio/Machines/id_swipe.ogg
          ejectSound: /Audio/Machines/id_swipe.ogg
    - type: AccessReader
      access:
        - [Security]
    - type: ActivatableUI
      key: enum.BadgePrinterUiKey.Key
    - type: UserInterface
      interfaces:
        enum.BadgePrinterUiKey.Key:
          type: BadgePrinterBoundUserInterface
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.4,-0.4,0.4,0.4"
          density: 190
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Anchorable
    - type: Transform
      anchored: true
    - type: Appearance
    - type: WiresPanel
    - type: ApcPowerReceiver
      powerLoad: 100
