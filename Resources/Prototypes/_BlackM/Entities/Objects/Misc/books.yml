  - type: Sprite
    layers:
    - state: paper
    - state: cover_old
      color: "#6c4718"
    - state: decor_wingette
      color: "#b5913c"
    - state: icon_glow
      color: blue
  - type: GuideHelp
    guides:
    - Command

