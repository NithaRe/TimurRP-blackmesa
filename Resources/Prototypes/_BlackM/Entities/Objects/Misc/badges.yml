- type: entity
  id: AccessCardHolder
  name: карта доступа
  description: Специальная карта-держатель. Вмещает до 6 ключей доступа, которые дают различные уровни доступа. Осмотрите карту, чтобы увидеть вставленные ключи.
  parent: BaseItem
  components:
    - type: AccessCardHolder
      maxBadges: 6
      badgeContainerId: badge_slots
    - type: Access
    - type: IdCard
    - type: StationRecordKeyStorage
    - type: Clothing
      slots:
        - idcard
    - type: Tag
      tags:
        - WhitelistChameleon
        - WhitelistChameleonIdCard
    - type: Sprite
      sprite: _BlackM/Objects/Misc/access_card_holder.rsi
      layers:
        - state: icon
    - type: Item
      size: Small
      storedRotation: -90
    - type: ContainerContainer
      containers:
        badge_slots: !type:Container {}

- type: entity
  id: BaseBadge
  abstract: true
  parent: BaseItem
  components:
    - type: Badge
    - type: Item
      size: Tiny
    - type: Sprite
      sprite: _BlackM/Objects/Misc/badges.rsi
      layers:
        - state: maintenance

- type: entity
  id: BadgeSecurity
  name: ключ безопасности Ковак
  description: Фиолетовый ключ Ковак. Даёт доступ к зонам отдела контроля и подавления, оружейной и изолятору.
  parent: BaseBadge
  components:
    - type: Badge
      accessTags:
        - Security
        - Detective
        - Brig
        - GenpopEnter
        - GenpopLeave
      examineColor: "#e63232"
      cardSpriteState: seconcard
    - type: Sprite
      sprite: _BlackM/Objects/Misc/badges.rsi
      layers:
        - state: security

