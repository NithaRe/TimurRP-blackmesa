- type: entity
  parent: PassengerIDCard
  id: BmesaResearchAssistantIDCard
  name: Bmesa research assistant ID card
  description: Identification card for Bmesa research personnel.
  components:
  - type: PresetIdCard
    job: BmesaScientist
  - type: Sprite
    sprite: "/Textures/Objects/Misc/id_cards.rsi"
    layers:
    - state: default
    - state: idintern-sci
      sprite: "/Textures/_BlackM/Objects/Misc/id_cards.rsi"
  - type: Tag
    tags:
    - WhitelistChameleonIdCard

