- type: entity
  parent: BasePDA
  id: BmesaResearchDirectorPDA
  name: research director PDA
  description: Black Mesa research director PDA.
  components:
  - type: Sprite
    sprite: "/Textures/_BlackM/Objects/Devices/pda.rsi"
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda-seniorresearcher"
    - sprite: "/Textures/Objects/Devices/pda.rsi"
      state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - sprite: "/Textures/Objects/Devices/pda.rsi"
      state: "id_overlay"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
    - sprite: "/Textures/Objects/Devices/pda.rsi"
      state: "insert_overlay"
      map: [ "enum.PdaVisualLayers.Pen" ]
  - type: Pda
    id: BmesaResearchDirectorIDCard
    penSlot:
      startingItem: Pen
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-seniorresearcher
  - type: PdaBorderColor
    borderColor: "#aa00ff"
    accentVColor: "#44aaee"
  - type: Icon
    sprite: "/Textures/_BlackM/Objects/Devices/pda.rsi"
    state: pda-seniorresearcher

