- type: entity
  id: SpawnMarkerBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      anchored: true
    - type: Marker
    - type: Clickable
    - type: InteractionOutline
    - type: Tag
      tags:
        - ForceFixRotations
    - type: Sprite
      drawdepth: Overdoors
      sprite: Markers/cross.rsi

- type: entity
  id: MobSpawnMarker
  name: ЗЕН-ТЕХИ спавнер
  description: Спавнит моба на этом месте при старте раунда. При смерти — респавнит через respawnDelay секунд.
  parent: SpawnMarkerBase
  components:
    - type: MobSpawnMarker
      prototype: MobHeadcrabBlackM
      count: 1
      respawnDelay: 60
    - type: Sprite
      drawdepth: Overdoors
      sprite: Markers/cross.rsi
      state: red

- type: entity
  id: MobSpawnRadiusMarker
  name: ЗЕН-ТЕХИ спавнер РАДИУС
  description: Спавнит моба в радиусе от этого места при старте раунда. При смерти — респавнит через respawnDelay секунд.
  parent: SpawnMarkerBase
  components:
    - type: MobSpawnRadiusMarker
      prototype: MobHeadcrabBlackM
      count: 1
      radius: 3.0
      respawnDelay: 60
    - type: Sprite
      drawdepth: Overdoors
      sprite: Markers/cross.rsi
      state: pink

- type: entity
  id: ItemSpawnMarker
  name: ЗЕН спавнер вещей в точке
  description: Спавнит случайную вещь из списка на этом месте при старте раунда.
  parent: SpawnMarkerBase
  components:
    - type: ItemSpawnMarker
      prototypes:
        - Crowbar
      count: 1
    - type: Sprite
      drawdepth: Overdoors
      sprite: Markers/cross.rsi
      state: green

- type: entity
  id: ItemSpawnRadiusMarker
  name: ЗЕН спавнер вещей в радиусе
  description: Спавнит случайную вещь из списка в радиусе от этого места при старте раунда.
  parent: SpawnMarkerBase
  components:
    - type: ItemSpawnRadiusMarker
      prototypes:
        - Crowbar
      count: 1
      radius: 3.0
    - type: Sprite
      drawdepth: Overdoors
      sprite: Markers/cross.rsi
      state: blue
