- type: entity
  parent: WallRockChromiteArtifactFragment
  id: WallRockChromiteXenFossil
  name: Xen fossil deposit
  description: A chromite wall containing a mineralized Xen organism.
  suffix: Xen Fossil
  components:
  - type: OreVein
    currentOre: OreXenFossil

- type: entity
  parent: MarkerBase
  id: WallRockChromiteXenFossilSpawner
  name: chromite wall spawner
  suffix: 1% Xen Fossil
