- type: entity
  id: AmsMachine
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: _BlackM/Structures/ams_machine.rsi
    layers:
    - state: base
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PointLight
    enabled: true
    radius: 3
    energy: 1.5
    color: "#3ad1ff"
  - type: AmbientSound
    enabled: true
    range: 4
    volume: -10
    sound:
      path: /Audio/_BlackM/Ams/ams_hum_idle.ogg
  - type: InteractionOutline
  - type: Ams
    chargeTime: 300
    activeDuration: 300
    detonationDelay: 60
  - type: ItemSlots
    slots:
      ams_part_core:
        name: ams-part-core
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCore]
      ams_part_coil:
        name: ams-part-coil
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCoil]
      ams_part_lens:
        name: ams-part-lens
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartLens]
      ams_part_cell:
        name: ams-part-cell
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCell]
      ams_part_stabilizer:
        name: ams-part-stabilizer
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartStabilizer]
      ams_part_casing:
        name: ams-part-casing
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCasing]
  - type: ActivatableUI
    key: enum.AmsUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AmsUiKey.Key:
        type: AmsBoundUserInterface
