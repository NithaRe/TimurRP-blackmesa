- type: entity
  id: AmsMachine
  parent: BaseStructure
  components:
  - type: Sprite
    sprite: _BlackM/Structures/ams_machine.rsi
    layers:
    - state: base
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: PointLight
    enabled: true
    radius: 3
    energy: 1.5
    color: "#3ad1ff"
  - type: AmbientSound
    enabled: true
    range: 4
    volume: -10
    sound:
      path: /Audio/_BlackM/Ams/ams_hum_idle.ogg
  - type: InteractionOutline
  - type: Ams
    chargeTime: 300
    activeDuration: 300
    detonationDelay: 60
    requireSample: true
    sampleOffset: 0,-1
    sampleRange: 0.6
    reinforceDelay: 2
    reinforcements:
      ams_part_core:
        stack: Plasteel
        amount: 5
      ams_part_coil:
        stack: Steel
        amount: 10
      ams_part_lens:
        stack: Glass
        amount: 10
      ams_part_cell:
        stack: Plastic
        amount: 5
      ams_part_stabilizer:
        stack: Plasteel
        amount: 3
      ams_part_casing:
        stack: Steel
        amount: 15
    waveSpeed: 14
    waveExplosionSpacing: 7
    waveExplosionChance: 0.45
    waveExplosionsPerSecond: 14
    portalPrototype: AmsXenPortal
    portalIntervalStart: 4
    portalIntervalEnd: 0.6
    portalSpawns:
    - MobHoundeyeBlackM
    - MobVortigauntBlackM
    - MobHeadcrabBlackM
    portalSpawnChance: 0.25
  - type: ItemSlots
    slots:
      ams_part_core:
        name: ams-part-core
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCore]
      ams_part_coil:
        name: ams-part-coil
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCoil]
      ams_part_lens:
        name: ams-part-lens
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartLens]
      ams_part_cell:
        name: ams-part-cell
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCell]
      ams_part_stabilizer:
        name: ams-part-stabilizer
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartStabilizer]
      ams_part_casing:
        name: ams-part-casing
        insertSound:
          path: /Audio/_BlackM/Ams/ams_insert.ogg
        whitelist:
          tags: [AmsPartCasing]
  - type: ActivatableUI
    key: enum.AmsUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AmsUiKey.Key:
        type: AmsBoundUserInterface
