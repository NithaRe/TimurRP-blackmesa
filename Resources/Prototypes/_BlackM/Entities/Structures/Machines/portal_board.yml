- type: entity
  parent: BaseMachineCircuitboard
  id: MachineEvacPortalCircuitboard
  name: evacuation portal board
  description: A machine board for the Evacuation Portal. Insert 5 portal components into a machine frame to assemble.
  components:
  - type: Sprite
    sprite: _BlackM/Objects/Portal/module.rsi
    state: portal_board
  - type: MachineBoard
    prototype: MachineEvacPortal
    stackRequirements:
      Cable: 5
      Steel: 10
      PortalResonatorStack: 1
      PortalSynchronizerStack: 1
      PortalStabilizerStack: 1
      PortalConverterStack: 1
      PortalMatrixStack: 1
  - type: Item
    size: Normal

- type: entity
  id: MachineEvacPortal
  name: evacuation portal
  suffix: Assembled
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable
  - type: EvacPortal
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.EvacPortalUiKey.Key:
        type: EvacPortalBoundUserInterface
  - type: ActivatableUI
    key: enum.EvacPortalUiKey.Key
    requireHands: false
    inHandsOnly: false
  - type: Sprite
    sprite: _BlackM/Structures/Portal/portal.rsi
    noRot: true
    layers:
    - state: frame
    - state: portal
      shader: unshaded
      map: ["enum.EvacPortalVisualLayers.Portal"]
      visible: false
    - state: on
      shader: unshaded
      map: ["enum.EvacPortalVisualLayers.Active"]
      visible: false
  - type: Construction
    graph: Machine
    node: machine
  - type: Machine
    board: MachineEvacPortalCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: EvacPortalDestination
  name: Эвакуационный Портал
  description: Портал который был синхронизирован с другим.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: EvacPortalDestination
  - type: Sprite
    sprite: _BlackM/Structures/Portal/portal.rsi
    noRot: true
    layers:
    - state: frame
    - state: on
      shader: unshaded
      visible: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Clickable
  - type: InteractionOutline
  - type: Anchorable