- type: entity
  id: ComputerXenExperimentConsole
  parent: BaseComputerAiAccess
  name: Xen experiment console
  description: A Black Mesa terminal for controlled experiments on Xen samples.
  components:
  - type: XenExperimentConsole
  - type: ResearchClient
  - type: ItemSlots
    slots:
      xen_experiment_sample:
        name: xen-experiment-console-slot-sample
        whitelist:
          components:
          - ScientificCrusherInput
        insertVerbText: xen-experiment-console-insert-sample
        ejectVerbText: xen-experiment-console-eject-sample
        swap: true
        priority: 2
      xen_experiment_capacitor:
        name: xen-experiment-console-slot-capacitor
        whitelist:
          components:
          - XenExperimentCapacitor
        insertVerbText: xen-experiment-console-insert-capacitor
        ejectVerbText: xen-experiment-console-eject-capacitor
        swap: true
        priority: 1
  - type: ContainerContainer
    containers:
      board: !type:Container
      xen_experiment_sample: !type:ContainerSlot { }
      xen_experiment_capacitor: !type:ContainerSlot { }
  - type: ActivatableUI
    key: enum.XenExperimentConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.XenExperimentConsoleUiKey.Key:
        type: XenExperimentConsoleBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: artifact
    - map: ["computerLayerKeys"]
      state: tech_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: ApcPowerReceiver
    powerLoad: 1200
  - type: Computer
    board: XenExperimentConsoleCircuitboard
  - type: AccessReader
    access: [["Research"]]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#5ba6a6"

- type: entity
  id: XenExperimentConsoleCircuitboard
  parent: BaseComputerCircuitboard
  name: Xen experiment console board
  description: A computer printed circuit board for a Xen experiment console.
  components:
  - type: Sprite
    state: cpu_science
  - type: ComputerBoard
    prototype: ComputerXenExperimentConsole
