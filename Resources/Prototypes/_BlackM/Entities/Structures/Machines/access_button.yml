- type: entity
  parent: BaseWallmountMetallic
  id: AccessButton
  name: Сканер доступа
  description: Настенная штука со считывателем карт.
  components:
    - type: WallMount
      arc: 360
    - type: StationAiWhitelist
    - type: Sprite
      drawdepth: SmallObjects
      sprite: _BlackM/Structures/Wallmounts/access_button.rsi
      layers:
        - state: base
    - type: Appearance
    - type: UseDelay
      delay: 0.5
    - type: AccessButton
      port: Pressed
    - type: Rotatable
    - type: DeviceNetwork
      deviceNetId: Wireless
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSource
      ports:
        - Pressed
    - type: Transform
      anchored: false
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
                params:
                  volume: -8
