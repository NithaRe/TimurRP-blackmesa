    canCollide: true
  - type: Fixtures
    fixtures:
      portalFixture:
        shape:
          !type:PhysShapeCircle
          radius: 1.0
        hard: false
        mask:
        - Impassable
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Portal
    canTeleportToOtherMaps: true
    randomTeleport: false
  - type: TeleportGateway
    pairKey: "alpha"
  - type: Sprite
    sprite: _BlackM/Structures/Machines/gateway.rsi
    layers:
