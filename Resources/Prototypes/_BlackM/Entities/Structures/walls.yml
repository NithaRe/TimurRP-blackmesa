- type: entity
  parent: WallRock
  id: WallBmesaIndestructible
  name: Каменная стена
  description: "Эээ, вы же под землей, что вы ожидали тут увидеть?"
  suffix: Indestructible
  components:
  - type: Godmode
  - type: Sprite
    layers:
      - state: rock
      - map: [ "enum.EdgeLayer.South" ]
        state: rock_south
      - map: [ "enum.EdgeLayer.East" ]
        state: rock_east
      - map: [ "enum.EdgeLayer.North" ]
        state: rock_north
      - map: [ "enum.EdgeLayer.West" ]
        state: rock_west
  - type: Destructible
  - type: RustRequiresPathStage
    pathStage: 11

- type: entity
  parent: BaseWall
  id: WallReinforcedInfectedBlackM
  name: Заражённая укреплённая стена
  description: Толстый слой металла, покрытый неизвестной биомассой.
  suffix: BlackM
  components:
  - type: Sprite
    sprite: _BlackM/Structures/Walls/solid-infected.rsi
  - type: Icon
    sprite: _BlackM/Structures/Walls/solid-infected.rsi
  - type: RCDDeconstructable
    cost: 12
    delay: 10
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ReinforcedGirder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: solid