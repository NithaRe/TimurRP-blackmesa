- type: entity
  parent: ComputerCargoOrders
  id: ComputerAmsPartsOrders
  name: AMS components console
  description: Acquisition records for all six anti-mass spectrometer components. Components cannot be purchased.
  components:
  - type: CargoOrderConsole
    allowedGroups:
    - AmsParts
  - type: Computer
    board: AmsPartsOrderComputerCircuitboard

- type: entity
  parent: CargoRequestComputerCircuitboard
  id: AmsPartsOrderComputerCircuitboard
  name: AMS components console board
  description: A computer circuitboard for an AMS components console.
  components:
  - type: ComputerBoard
    prototype: ComputerAmsPartsOrders

- type: entity
  abstract: true
  parent: BaseComputer
  id: BaseAmsPartFabricator
  name: AMS component fabrication console
  description: A specialized fabrication console. Load raw materials to manufacture its assigned AMS component.
  components:
  - type: Sprite
    layers:
    - state: computer
      map: ["computerLayerBody"]
    - state: generic_keyboard
      map: ["computerLayerKeyboard"]
    - state: rdcomp
      map: ["computerLayerScreen"]
    - state: rd_key
      map: ["computerLayerKeys"]
    - state: generic_panel_open
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: Lathe
  - type: MaterialStorage
    whitelist:
      tags: [Sheet, RawMaterial, Ingot]
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
      enum.LatheVisuals.IsRunning:
        computerLayerScreen:
          True: { color: "#92FFC3" }
          False: { color: "#FFFFFF" }

