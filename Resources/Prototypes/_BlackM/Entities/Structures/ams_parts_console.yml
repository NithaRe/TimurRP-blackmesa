- type: entity
  parent: ComputerCargoOrders
  id: ComputerAmsPartsOrders
  name: AMS components console
  description: Acquisition records for all six anti-mass spectrometer components. Components cannot be purchased.
  components:
  - type: CargoOrderConsole
    allowedGroups:
    - AmsParts
  - type: Computer
    board: AmsPartsOrderComputerCircuitboard

- type: entity
  parent: CargoRequestComputerCircuitboard
  id: AmsPartsOrderComputerCircuitboard
  name: AMS components console board
  description: A computer circuitboard for an AMS components console.
  components:
  - type: ComputerBoard
    prototype: ComputerAmsPartsOrders

- type: entity
  abstract: true
  parent: BaseComputer
  id: BaseAmsPartFabricator
  name: AMS part fabricator
  description: A specialized fabricator. Uses a dedicated component and raw materials to manufacture one type of AMS part.
  components:
  - type: CargoSellBlacklist
  - type: Construction
    graph: AmsPartFabricator
    node: assembled
    deconstructionTarget: null
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: Sprite
    sprite: _BlackM/Structures/Machines/ams_part_fabricator.rsi
    offset: 0,0.5
    noRot: true
    layers:
    - &amsFabricatorBody
      state: base
      map: ["computerLayerBody"]
    - &amsFabricatorPanel
      state: service-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 1500
  - type: Lathe
  - type: MaterialStorage
    whitelist:
      tags: [Sheet, RawMaterial, Ingot]
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: AmsPartFabricatorBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }
      enum.LatheVisuals.IsRunning:
        computerLayerScreen:
          True: { color: "#FFFFFF" }
          False: { color: "#B0B0B0" }

- type: entity
  parent: BaseAmsPartFabricator
  id: ComputerAmsCoilFabricator
  name: AMS part fabricator - coil
  components:
  - type: Sprite
    layers:
    - *amsFabricatorBody
    - state: coil
      map: &amsFabricatorAnimationLayer ["computerLayerScreen"]
      shader: unshaded
      color: "#B0B0B0"
      visible: false
    - *amsFabricatorPanel
  - type: Lathe
    staticPacks: [AmsCoilConsolePack]
  - type: Computer
    board: AmsCoilFabricatorCircuitboard

