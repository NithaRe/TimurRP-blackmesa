#helmets kovak

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetKovakSoldier
  name: шлем солдата КОВАК
  description: Шлем солдата организации КОВАК. Оснащён защитным забралом.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/Head/Helmets/kovak_soldier_helmet.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/Head/Helmets/kovak_soldier_helmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
  - type: KovakHelmet
    toggleDelay: 2.5
    isOpen: false
    closedEquippedPrefix: ""
    openEquippedPrefix: open
    closedIconState: icon
    openIconState: open-icon
    closeMessage: "[КОВАК] Забрало опущено."
    openMessage: "[КОВАК] Забрало поднято."
    messageColor: "#7B2FBE"
    closeSound:
      path: /Audio/_BlackM/Kovak/helmet_close.ogg
    openSound:
      path: /Audio/_BlackM/Kovak/helmet_open.ogg

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHelmetKovakChief
  name: шлем главы КОВАК
