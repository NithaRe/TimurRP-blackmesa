- type: entity
  parent: ClothingHandsGlovesCombat
  id: ClothingHandsGlovesCombatFacilityManager
  name: facility manager's gloves
  description: Reinforced gloves issued to the Facility Manager. Fireproof, shock resistant, and surprisingly good at signing paperwork.

- type: entity
  parent: ClothingUniformJumpsuitDevil
  id: ClothingUniformJumpsuitFacilityManager
