  parent: ClothingBackpackSatchelLeather
  id: ClothingBackpackSatchelFacilityManager
  name: facility manager's satchel
  description: A leather satchel that has carried the documents, keycards and reports of more than one Facility Manager. It smells of old paper and strong coffee.