- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseMajorContraband ]
  id: ClothingHeadHelmetBlackOpsNVG
  name: шлем Black Ops с ПНВ
  description: Шлем разведчика Black Ops с четырёхлинзовым прибором ночного видения. Красные линзы светятся в темноте, а яркие вспышки слепят в нём вдвое сильнее.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet_nvg.rsi
    layers:
    - state: icon
    - state: icon-glow
      shader: unshaded
  - type: Clothing
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet_nvg.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-glow
        shader: unshaded
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.8
  - type: NightVision
    isEquipment: true
    flashDurationMultiplier: 2
  - type: EyeTrail
    colors:
    - "#ff7a7a"
    - "#ff2424"
    - "#c40000"
    - "#6e0000"
    eyes:
      South:
      - 14,5
      - 16,5
      - 12,6
      - 18,6
      North: []
      East:
      - 21,6
      - 18,7
      West:
      - 10,6
      - 13,7

- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseMajorContraband ]
  id: ClothingOuterArmorBlackOps
  name: бронежилет Black Ops
  description: Лёгкий бронежилет для скрытных операций. Пули часто рикошетят от плит, но уставшего бойца пробить гораздо проще.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/OuterClothing/Armor/blackops_armor.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/OuterClothing/Armor/blackops_armor.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.45
        Heat: 0.65
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.65
  - type: StaminaRicochetArmor
    maxRicochetChance: 0.85
    minRicochetChance: 0.05
    staminaExponent: 2 
    critAlwaysPenetrates: true
    staminaDamagePerRicochet: 12

