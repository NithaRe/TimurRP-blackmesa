- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseMajorContraband ]
  id: ClothingHeadHelmetBlackOps
  name: шлем Black Ops
  description: Облегчённый композитный шлем без опознавательных знаков. Black Ops официально не существует.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet.rsi
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.8

- type: entity
  parent: ClothingHeadHelmetBlackOps
  id: ClothingHeadHelmetBlackOpsMask
  name: шлем Black Ops с бронемаской
  description: Шлем командира Black Ops со встроенной бронемаской и тонированным визором. Скрывает лицо и защищает глаза от вспышек.
  components:
  - type: Sprite
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet_mask.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/Head/Helmets/blackops_helmet_mask.rsi
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
      NerveDamage: 0
