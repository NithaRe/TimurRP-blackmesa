  components:
  - type: Sprite
    sprite: _BlackM/Clothing/OuterClothing/Armor/hecuarmor.rsi
    state: icon
  - type: Clothing
    sprite: _BlackM/Clothing/OuterClothing/Armor/hecuarmor.rsi
  - type: Armor
