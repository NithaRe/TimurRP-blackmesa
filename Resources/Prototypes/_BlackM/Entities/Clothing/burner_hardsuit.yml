      sprite: _BlackM/Clothing/OuterClothing/Hardsuits/burner_hardsuit.rsi
    - type: Clothing
      sprite: _BlackM/Clothing/OuterClothing/Hardsuits/burner_hardsuit.rsi
    - type: PressureProtection
