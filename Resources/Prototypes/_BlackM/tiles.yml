- type: tile
  id: FloorPoolsi
  name: tiles-poolsi
  sprite: /Textures/_BlackM/Tiles/poolsi.png
  variants: 1
  placementVariants:
    - 1.0
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [Prying]
  footstepSounds:
    collection: FootstepFloor
  itemDrop: FloorTileItemPoolsi
  heatCapacity: 10000
  tileRipResistance: 4500

- type: entity
  name: floor-tile-item-poolsi
