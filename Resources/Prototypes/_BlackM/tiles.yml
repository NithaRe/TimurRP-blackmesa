- type: tile
  id: FloorPoolsi
  name: tiles-poolsi
  sprite: /Textures/_BlackM/Tiles/poolsi.png
  variants: 1
  placementVariants:
    - 1.0
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [Prying]
  footstepSounds:
    collection: FootstepFloor
  itemDrop: FloorTileItemPoolsi
  heatCapacity: 10000
  tileRipResistance: 4500

- type: entity
  parent: FloorTileItemBase
  id: FloorTileItemPoolsi
  name: ent-FloorTileItemPoolsi
  description: ent-FloorTileItemPoolsi-desc
  components:
    - type: Sprite
      sprite: _BlackM/Tiles/poolsi.rsi
      state: poolsi
    - type: FloorTile
      outputs:
        - Plating
        - FloorPoolsi
    - type: Stack
      stackType: FloorTileItemPoolsi

- type: stack
  id: FloorTileItemPoolsi
  name: ent-FloorTileItemPoolsi
  icon:
    sprite: _BlackM/Tiles/poolsi.rsi
    state: poolsi
  maxCount: 30
  spawn: FloorTileItemPoolsi

