      outputs:
        - Plating
        - FloorPoolsi
    - type: Stack
      stackType: FloorTileItemPoolsi

- type: stack
  id: FloorTileItemPoolsi
  name: floor-tile-item-poolsi
  icon:
    sprite: _BlackM/Tiles/poolsi.rsi
    state: poolsi
  maxCount: 30
  spawn: FloorTileItemPoolsi

