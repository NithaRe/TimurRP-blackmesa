- type: entity
  id: MachineArtifactAnalyzer
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  name: Xen crystal research chamber
  description: A chamber for controlled exposure and cultivation of Xen crystals.
  components:
  - type: Sprite
    noRot: true
    sprite: _BlackM/Structures/Machines/crystal_cultivator.rsi
    offset: 0,0.25
    drawdepth: HighFloorObjects
    layers:
    - state: base
    - sprite: _BlackM/Objects/Zen/research_crystal.rsi
      state: seed
      offset: 0,-0.25
      visible: false
      map: ["enum.ZenCrystalChamberVisuals.Sample"]
    - sprite: _BlackM/Objects/Zen/research_crystal.rsi
      state: deposits
      offset: 0,-0.25
      visible: false
      map: ["enum.ZenCrystalChamberVisuals.Deposits"]
    - sprite: _BlackM/Objects/Zen/research_crystal.rsi
      state: seed-cracks
      offset: 0,-0.25
      visible: false
      map: ["enum.ZenCrystalChamberVisuals.Cracks"]
    - state: closed
      map: ["enum.ZenCrystalChamberVisuals.LidOpen"]
    - state: powered
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: active
      shader: unshaded
      visible: false
      map: ["enum.ZenCrystalChamberVisuals.Active"]
    - state: active
      shader: unshaded
      color: "#FF5F4A"
      visible: false
      map: ["enum.ZenCrystalChamberVisuals.Alarm"]
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: AmbientSound
    enabled: false
    sound:
      path: /Audio/Machines/scan_loop.ogg
    range: 5
    volume: -8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        # Keep the visible sample reachable over the low machine body.
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable
  - type: Transform
    anchored: true
  - type: ApcPowerReceiver
    powerLoad: 500
    needsPower: true
  - type: ZenCrystalChamber
    lidOpen: true
  - type: DragDropTargetable
  - type: ContainerContainer
    containers:
      zen_crystal_sample: !type:ContainerSlot
        showEnts: false
        occludes: false
  - type: ItemSlots
    slots:
      zen_crystal_sample:
        name: zen-lab-slot-sample
        whitelist:
          components: [ZenCrystalResearch]
        insertVerbText: zen-lab-insert-sample
        ejectVerbText: zen-lab-eject-sample
        lockedFailPopup: zen-lab-sample-lid-closed
        insertSuccessPopup: zen-lab-sample-installed
        ejectOnInteract: false
        swap: false
        occludesLight: false
        priority: 10
      zen_growth_medium:
        name: zen-lab-slot-medium
        whitelist:
          components: [ZenGrowthMedium]
        insertVerbText: zen-lab-insert-medium
        ejectVerbText: zen-lab-eject-medium
        swap: true
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.ZenCrystalUiKey.Chamber
  - type: UserInterface
    interfaces:
      enum.ZenCrystalUiKey.Chamber:
        type: ZenCrystalChamberBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: DeviceNetwork
    deviceNetId: Wired
    receiveFrequencyId: BasicDevice
  - type: DeviceList
  - type: DeviceLinkSink
    ports:
      - ArtifactAnalyzerReceiver
      - ZenCrystalInput
  - type: Machine
    board: ArtifactAnalyzerMachineCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 0.35
    color: "#8EBBA4"
  - type: GuideHelp
    guides:
    - Xenoarchaeology
  - type: LitOnPowered
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ZenCrystalChamberVisuals.Sample:
        enum.ZenCrystalChamberVisuals.Sample:
          none: { visible: false }
          seed: { visible: true, state: seed, color: "#FFFFFF" }
          growing: { visible: true, state: growing, color: "#FFFFFF" }
          mature: { visible: true, state: mature, color: "#FFFFFF" }
          dim: { visible: true, state: mature, color: "#9A9A9A" }
          exhausted: { visible: true, state: mature, color: "#565E58" }
      enum.ZenCrystalChamberVisuals.Deposits:
        enum.ZenCrystalChamberVisuals.Deposits:
          True: { visible: true }
          False: { visible: false }
      enum.ZenCrystalChamberVisuals.Cracks:
        enum.ZenCrystalChamberVisuals.Cracks:
          none: { visible: false }
          seed: { visible: true, state: seed-cracks }
          growing: { visible: true, state: growing-cracks }
          mature: { visible: true, state: mature-cracks }
      enum.ZenCrystalChamberVisuals.Alarm:
        enum.ZenCrystalChamberVisuals.Alarm:
          True: { visible: true }
          False: { visible: false }
      enum.ZenCrystalChamberVisuals.LidOpen:
        enum.ZenCrystalChamberVisuals.LidOpen:
          True: { state: open }
          False: { state: closed }
      enum.ZenCrystalChamberVisuals.Active:
        enum.ZenCrystalChamberVisuals.Active:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  id: MachineArtifactCrusher
  parent: [ ConstructibleMachine, BaseMachinePowered ]
  name: artifact crusher
  description: Best not to let your fingers get stuck...
  components:
  - type: ArtifactCrusher
    crushingWhitelist:
      components:
      - XenoArtifact
      - ZenCrystalSpent
    crushingDamage:
      types:
        Blunt: 10
  - type: Machine
    board: ArtifactCrusherMachineCircuitboard
  - type: TogglePower # CorvaxGoob-TogglingPower
    altMode: false
  - type: WiresPanel
  - type: Sprite
    sprite: Structures/Machines/artifact_crusher.rsi
    offset: 0,0.5
    noRot: true
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: door-closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: piston
      map: ["pistonlayer"]
    - state: glass
    - state: lights
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 50
        mask:
        - HighImpassable
        layer:
        - HighImpassable
  - type: EntityStorage
    capacity: 1
    whitelist:
      components:
      - XenoArtifact
      - ZenCrystalSpent
      tags:
      - CanPilot # People
      - VimPilot # Pets
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ArtifactCrusherVisuals.Crushing:
        pistonlayer:
          True: {state: piston-push}
          False: {state: piston}
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: EntityStorageVisuals
    stateDoorClosed: door-closed
    openDrawDepth: 0
    closedDrawDepth: 4
  - type: Construction
    containers:
    - machine_board
    - machine_parts
    - entity_storage
    - output_container
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      entity_storage: !type:Container
      output_container: !type:Container
